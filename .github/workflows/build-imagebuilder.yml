name: Build ImageBuilder
run-name: "Build ImageBuilder — ${{ inputs.force_branch || 'auto-discover' }} on ${{ inputs.runner || 'ubuntu-latest' }}"

on:
  schedule:
    - cron: "0 4 * * 0" # Weekly Sunday 04:00 UTC
  workflow_dispatch:
    inputs:
      force_branch:
        description: "Force build a specific branch (leave empty for auto-discover)"
        required: false
        type: string
      runner:
        description: "Runner to use for the build job"
        required: true
        type: choice
        default: ubuntu-latest
        options:
          - ubuntu-latest
          - build-unraid
          - build-smospab

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ogglord/openwrt-imagebuilder

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      branch: ${{ steps.discover.outputs.branch }}
      asu_version: ${{ steps.discover.outputs.asu_version }}
      commit_sha: ${{ steps.discover.outputs.commit_sha }}
      release_dir: ${{ steps.discover.outputs.release_dir }}
      new_commits: ${{ steps.discover.outputs.new_commits }}
    steps:
      - name: Discover latest release dir and check for new commits
        id: discover
        env:
          FORCE_BRANCH: ${{ inputs.force_branch }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          # Derive ASU X.Y version from pesa branch name
          # next-r4.7.4.rss.mtk → 4.7, next-r4.8.0.rss.mtk → 4.8
          # Test branches (containing -test) still get an ASU version — the
          # config.buildinfo pipeline doesn't care about test-ness, only
          # that a release dir exists for the branch.
          derive_asu_version() {
            local branch="$1"
            if [[ "$branch" == *"-test"* ]]; then
              echo "SKIP"
              return
            fi
            echo "$branch" | sed 's/^next-r//' | cut -d. -f1,2
          }

          # List pesa's release directories (shared by both code paths below)
          DIRS=$(curl -fsSL "https://api.github.com/repos/pesa1234/MT6000_cust_build/contents/" \
            -H "Accept: application/vnd.github.v3+json" | \
            jq -r '.[] | select(.type == "dir") | .name' | \
            grep -E '^[0-9]{4}' || true)

          if [[ -z "$DIRS" ]]; then
            echo "::error::No release directories found in MT6000_cust_build"
            echo "new_commits=false" >> "$GITHUB_OUTPUT"
            exit 1
          fi

          # Pick release dir:
          #   * force_branch: latest dir whose branch suffix matches (supports
          #     re-building the newest release of a branch, including test ones)
          #   * auto: absolute latest across all branches
          if [[ -n "${FORCE_BRANCH:-}" ]]; then
            RELEASE_DIR=$(echo "$DIRS" | grep -E "_${FORCE_BRANCH}$" | sort | tail -1 || true)
            if [[ -z "$RELEASE_DIR" ]]; then
              echo "::error::No release dir for branch '${FORCE_BRANCH}' in MT6000_cust_build"
              exit 1
            fi
            echo "Force-building branch: ${FORCE_BRANCH}"
          else
            RELEASE_DIR=$(echo "$DIRS" | sort | tail -1)
          fi

          # Parse: YYYY-MM-DD_rREV-HASH_BRANCH  (hash is short, branch may contain hyphens)
          BRANCH=$(echo "$RELEASE_DIR" | sed -E 's/^[0-9]{4}-[0-9]{2}-[0-9]{2}_r[0-9]+-[a-f0-9]+_//')
          RELEASE_COMMIT=$(echo "$RELEASE_DIR" | sed -E 's/^[0-9]{4}-[0-9]{2}-[0-9]{2}_r[0-9]+-([a-f0-9]+)_.*/\1/')
          if [[ -z "$BRANCH" || -z "$RELEASE_COMMIT" || "$BRANCH" == "$RELEASE_DIR" ]]; then
            echo "::error::Could not parse release dir: $RELEASE_DIR"
            exit 1
          fi

          echo "Release dir:    ${RELEASE_DIR}"
          echo "Branch:         ${BRANCH}"
          echo "Release commit: ${RELEASE_COMMIT} (short)"

          # Resolve short hash → full SHA against pesa/openwrt so we can
          # git-fetch exactly that commit later (and so the "already built"
          # check compares a stable identifier).
          LATEST_SHA=$(gh api "repos/pesa1234/openwrt/commits/${RELEASE_COMMIT}" --jq .sha)
          echo "Full commit SHA: ${LATEST_SHA}"

          # Skip if we've already built this commit for this branch
          TAG="mediatek-filogic-${BRANCH}"
          ALREADY_BUILT=$(gh api "repos/${{ github.repository }}/releases/tags/${TAG}" --jq .body 2>/dev/null | grep -c "${LATEST_SHA}" || true)
          if [[ "$ALREADY_BUILT" -gt 0 && -z "${FORCE_BRANCH:-}" ]]; then
            echo "Commit ${LATEST_SHA} already built — skipping"
            echo "new_commits=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          ASU_VER=$(derive_asu_version "$BRANCH")
          if [[ "$ASU_VER" == "SKIP" && -z "${FORCE_BRANCH:-}" ]]; then
            echo "::warning::Latest branch is a test branch (${BRANCH}) — skipping scheduled run"
            echo "new_commits=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "new_commits=true"   >> "$GITHUB_OUTPUT"
          echo "branch=${BRANCH}"   >> "$GITHUB_OUTPUT"
          echo "asu_version=${ASU_VER}" >> "$GITHUB_OUTPUT"
          echo "commit_sha=${LATEST_SHA}" >> "$GITHUB_OUTPUT"
          echo "release_dir=${RELEASE_DIR}" >> "$GITHUB_OUTPUT"


  build:
    name: build (${{ needs.discover.outputs.branch }})
    needs: discover
    if: needs.discover.outputs.new_commits == 'true'
    runs-on: ${{ inputs.runner || 'ubuntu-latest' }}
    timeout-minutes: 360

    steps:
      - name: Ping healthcheck start
        run: curl -fsS -m 10 --retry 3 "https://hc-ping.com/${{ secrets.HEALTHCHECK_BUILD_UUID }}/start" || true

      - uses: actions/checkout@v5

      - name: Free disk space
        if: inputs.runner == 'ubuntu-latest' || inputs.runner == ''
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: false
          docker-images: true
          swap-storage: true

      - name: Install build dependencies
        if: inputs.runner == 'ubuntu-latest' || inputs.runner == ''
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential clang flex bison g++ gawk gcc-multilib \
            g++-multilib gettext git libncurses-dev libssl-dev \
            python3-setuptools rsync swig unzip \
            zlib1g-dev file wget curl zstd
          sudo apt-get autoremove -y && sudo apt-get clean -y

      - name: Clean previous build
        if: inputs.runner != 'ubuntu-latest' && inputs.runner != ''
        run: rm -rf ${{ runner.temp }}/openwrt

      - name: Clone OpenWrt source at release commit
        env:
          BRANCH: ${{ needs.discover.outputs.branch }}
          RELEASE_SHA: ${{ needs.discover.outputs.commit_sha }}
        run: |
          set -euo pipefail
          DEST="${{ runner.temp }}/openwrt"
          # Fetch just the release commit — much smaller than cloning the
          # full branch history, and guarantees we build from the exact
          # source pesa built his release from.
          mkdir -p "$DEST" && cd "$DEST"
          git init --quiet
          git remote add origin https://github.com/pesa1234/openwrt.git
          git fetch --depth 1 origin "$RELEASE_SHA"
          git checkout --quiet FETCH_HEAD
          echo "Checked out $(git rev-parse HEAD) on ${BRANCH}"

      - name: Cache dl/ directory
        run: |
          if [[ "${{ inputs.runner }}" != "ubuntu-latest" && -n "${{ inputs.runner }}" ]]; then
            # Self-hosted: use a persistent local directory (no network overhead)
            mkdir -p "$HOME/.cache/openwrt-dl"
            ln -sf "$HOME/.cache/openwrt-dl" "${{ runner.temp }}/openwrt/dl"
            echo "Linked dl/ to local cache ($HOME/.cache/openwrt-dl)"
            echo "Cached files: $(ls "$HOME/.cache/openwrt-dl" | wc -l)"
          else
            # GitHub-hosted: just create dl/ — actions/cache handles persistence
            mkdir -p "${{ runner.temp }}/openwrt/dl"
          fi

      - name: Restore dl/ cache (GitHub-hosted)
        if: inputs.runner == 'ubuntu-latest' || inputs.runner == ''
        uses: actions/cache@v5
        with:
          path: ${{ runner.temp }}/openwrt/dl
          key: openwrt-dl-${{ needs.discover.outputs.branch }}-${{ needs.discover.outputs.commit_sha }}
          restore-keys: |
            openwrt-dl-${{ needs.discover.outputs.branch }}-
            openwrt-dl-

      - name: Update and install feeds
        working-directory: ${{ runner.temp }}/openwrt
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          ./scripts/feeds install -a

      - name: Patch Makefile defaults to match openssl build
        working-directory: ${{ runner.temp }}/openwrt
        run: |
          # This build uses openssl variants; patch the imagebuilder metadata so
          # DEFAULT_PACKAGES reflects what was actually compiled (not mbedtls).
          sed -i 's/wpad-basic-mbedtls/wpad-openssl/g' target/linux/mediatek/filogic/target.mk
          sed -i 's/libustream-mbedtls/libustream-openssl/g' include/target.mk
          sed -i 's/apk-mbedtls/apk-openssl/g' include/default-packages.mk

      - name: Download and apply config
        working-directory: ${{ runner.temp }}/openwrt
        run: |
          # Use the *resolved* config.buildinfo from pesa's release directory
          # instead of the pre-build config_file/.config template. This is the
          # exact config pesa's firmware was built from, so our IB-built
          # packages match the .manifest we use as firmware-packages.txt —
          # no risk of "package X not found" at make image time.
          CONFIG_URL="https://raw.githubusercontent.com/pesa1234/MT6000_cust_build/refs/heads/main/${RELEASE_DIR}/targets/mediatek/filogic/config.buildinfo"
          echo "Fetching config from: ${CONFIG_URL}"
          curl -fsSL "${CONFIG_URL}" -o .config
          echo "CONFIG_IB=y" >> .config
          echo "CONFIG_IB_STANDALONE=y" >> .config
          sed -i '/CONFIG_BPF_TOOLCHAIN/d' .config
          sed -i '/CONFIG_USE_LLVM_HOST/d' .config
          echo "CONFIG_BPF_TOOLCHAIN_HOST=y" >> .config
          echo "CONFIG_USE_LLVM_HOST=y" >> .config
          echo "LLVM tools on PATH:"
          llvm-config --version || llvm-config-18 --version || echo "llvm-config not found"
          which llvm-config llvm-config-18 clang clang-18 2>/dev/null || true
          LLVM_BINDIR=$(llvm-config --bindir 2>/dev/null || llvm-config-18 --bindir 2>/dev/null || echo "/usr/bin")
          LLVM_PATH="${LLVM_BINDIR%/bin}"
          echo "Using LLVM_PATH: ${LLVM_PATH}"
          echo "CONFIG_BPF_TOOLCHAIN_HOST_PATH=\"${LLVM_PATH}\"" >> .config
          echo "CONFIG_PACKAGE_nordvpnlite=n" >> .config
          echo "CONFIG_PACKAGE_onionshare-cli=n" >> .config
          make defconfig
          # Set version to the branch name so firmware reports a specific version
          # instead of "SNAPSHOT". This allows ASU to resolve the correct
          # imagebuilder container tag without custom patches.
          # Done after defconfig so it cannot be overridden by defaults.
          ASU_VER="${{ needs.discover.outputs.asu_version }}"
          sed -i '/^CONFIG_VERSION_NUMBER=/d' .config
          if [[ "$ASU_VER" != "SKIP" ]]; then
            echo "CONFIG_VERSION_NUMBER=\"${ASU_VER}-SNAPSHOT\"" >> .config
          else
            # Test branch: use pesa branch name as version
            echo "CONFIG_VERSION_NUMBER=\"${{ needs.discover.outputs.branch }}\"" >> .config
          fi
          sed -i '/^CONFIG_VERSION_REPO=/d' .config
          echo 'CONFIG_VERSION_REPO="https://github.com/Ogglord/openwrt-imagebuilder-mt6000"' >> .config
          # Pin CONFIG_VERSION_CODE to pesa's actual revision instead of
          # letting getver.sh compute it. The depth-1 fetch above has only
          # one commit of history, so getver.sh yields "r0-<7char-sha>".
          # release_dir has the shape YYYY-MM-DD_rREV-HASH_BRANCH (e.g.
          # 2026-04-16_r34302-4cd1e4be44_next-r4.8.0.rss.mtk-test6.18), so
          # the `rREV-HASH` chunk is exactly what firmware / ASU should
          # report.
          REV_HASH=$(echo "$RELEASE_DIR" | grep -oE 'r[0-9]+-[a-f0-9]+' | head -1)
          if [[ -n "$REV_HASH" ]]; then
            sed -i '/^CONFIG_VERSION_CODE=/d' .config
            echo "CONFIG_VERSION_CODE=\"${REV_HASH}\"" >> .config
            echo "Pinned CONFIG_VERSION_CODE=${REV_HASH}"
          else
            echo "::warning::Could not parse rREV-HASH from release_dir='${RELEASE_DIR}' — falling back to getver.sh (will produce r0-*)"
          fi
        env:
          FORCE_UNSAFE_CONFIGURE: 1
          LC_ALL: C
          RELEASE_DIR: ${{ needs.discover.outputs.release_dir }}

      - name: Inject APK signing key
        working-directory: ${{ runner.temp }}/openwrt
        env:
          PACKAGE_SIGNING_KEY: ${{ secrets.PACKAGE_SIGNING_KEY }}
          PACKAGE_SIGNING_KEY_PUB: ${{ secrets.PACKAGE_SIGNING_KEY_PUB }}
        run: |
          set -euo pipefail

          # Write RSA keypair for build-time package signing
          printf '%s\n' "${PACKAGE_SIGNING_KEY}" > key-build.rsa
          chmod 600 key-build.rsa
          printf '%s\n' "${PACKAGE_SIGNING_KEY_PUB}" > key-build.rsa.pub

          # Embed public key in firmware rootfs so APK trusts our packages on-device
          mkdir -p files/etc/apk/keys
          cp key-build.rsa.pub files/etc/apk/keys/pesabuilder-signing.rsa.pub

          echo "Signing key injected, public key embedded in firmware at files/etc/apk/keys/"

      - name: Pre-fetch linux-firmware via git-lfs
        working-directory: ${{ runner.temp }}/openwrt
        env:
          FORCE_UNSAFE_CONFIGURE: 1
          LC_ALL: C
        run: |
          # pesa1234/linux-firmware uses git-lfs for binary blobs. OpenWrt's
          # download fallback uses `git archive` which omits LFS content,
          # producing a broken tarball. We clone with LFS here and create the
          # tarball in the exact format OpenWrt expects in dl/.
          PACKAGE_MK="package/firmware/linux-firmware/Makefile"
          if [ ! -f "$PACKAGE_MK" ]; then
            echo "Package makefile not found, skipping pre-fetch"
            exit 0
          fi

          # Ask the build system for the resolved values instead of grepping
          SOURCE=$(make --no-print-directory -C package/firmware/linux-firmware val.PKG_SOURCE V=s 2>/dev/null || true)
          VERSION=$(make --no-print-directory -C package/firmware/linux-firmware val.PKG_VERSION V=s 2>/dev/null || true)
          PKG_COMMIT=$(make --no-print-directory -C package/firmware/linux-firmware val.PKG_SOURCE_VERSION V=s 2>/dev/null || true)
          MIRROR_HASH=$(make --no-print-directory -C package/firmware/linux-firmware val.PKG_MIRROR_HASH V=s 2>/dev/null || true)

          # Fall back to grepping if make val.* doesn't work in this fork
          if [ -z "$SOURCE" ]; then
            VERSION=$(grep -E '^PKG_VERSION' "$PACKAGE_MK" | head -1 | cut -d= -f2 | tr -d ' ')
            PKG_COMMIT=$(grep -E '^PKG_SOURCE_VERSION' "$PACKAGE_MK" | head -1 | cut -d= -f2 | tr -d ' ')
            MIRROR_HASH=$(grep -E '^PKG_MIRROR_HASH' "$PACKAGE_MK" | head -1 | cut -d= -f2 | tr -d ' ')
            SOURCE="linux-firmware-${VERSION}.tar.zst"
          fi

          if [[ -z "$VERSION" || -z "$PKG_COMMIT" ]]; then
            echo "Could not parse VERSION or PKG_SOURCE_VERSION — skipping pre-fetch"
            exit 0
          fi

          DL_DIR="${{ runner.temp }}/openwrt/dl"
          mkdir -p "$DL_DIR"
          if [ -f "$DL_DIR/$SOURCE" ]; then
            if [ -n "$MIRROR_HASH" ]; then
              CACHED_HASH=$(sha256sum "$DL_DIR/$SOURCE" | cut -d' ' -f1)
              if [ "$CACHED_HASH" = "$MIRROR_HASH" ]; then
                echo "Cached dl/$SOURCE hash matches PKG_MIRROR_HASH — skipping"
                exit 0
              else
                echo "Cached dl/$SOURCE hash mismatch (cached=$CACHED_HASH, expected=$MIRROR_HASH)"
                echo "Removing stale cached file and re-fetching"
                rm "$DL_DIR/$SOURCE"
              fi
            else
              echo "Already present in dl/: $SOURCE (no MIRROR_HASH to verify)"
              exit 0
            fi
          fi

          echo "Source: $SOURCE"
          echo "Version: $VERSION  Commit: $PKG_COMMIT"
          echo "Mirror hash: ${MIRROR_HASH:-none}"

          echo "Cloning pesa1234/linux-firmware at $PKG_COMMIT with LFS..."
          git clone --filter=blob:none https://github.com/pesa1234/linux-firmware.git "${{ runner.temp }}/linux-firmware-src"
          cd "${{ runner.temp }}/linux-firmware-src"
          git checkout "$PKG_COMMIT"
          git lfs pull
          SUBDIR="linux-firmware-${VERSION}"
          TAR_TIMESTAMP=$(git log -1 --no-show-signature --format='@%ct')
          cd "${{ runner.temp }}"
          mkdir -p "$SUBDIR"
          cp -a linux-firmware-src/. "$SUBDIR/"
          rm -rf "$SUBDIR/.git" "$SUBDIR/.gitmodules"

          # Create tarball with deterministic flags, matching the expected extension
          TAR_FLAGS="--numeric-owner --owner=0 --group=0 --mode=a-s --sort=name --mtime=$TAR_TIMESTAMP"
          case "$SOURCE" in
            *.tar.xz)  tar $TAR_FLAGS -cJf "$DL_DIR/$SOURCE" "$SUBDIR" ;;
            *.tar.zst) tar $TAR_FLAGS -c "$SUBDIR" | zstd -T0 -19 -c > "$DL_DIR/$SOURCE" ;;
            *.tar.gz)  tar $TAR_FLAGS -czf "$DL_DIR/$SOURCE" "$SUBDIR" ;;
            *.tar.bz2) tar $TAR_FLAGS -cjf "$DL_DIR/$SOURCE" "$SUBDIR" ;;
            *)         echo "Unknown archive format: $SOURCE"; exit 1 ;;
          esac
          rm -rf "$SUBDIR" linux-firmware-src

          ACTUAL_HASH=$(sha256sum "$DL_DIR/$SOURCE" | cut -d' ' -f1)
          echo "Created $SOURCE (sha256: $ACTUAL_HASH)"
          if [ -n "$MIRROR_HASH" ] && [ "$ACTUAL_HASH" != "$MIRROR_HASH" ]; then
            echo "Hash differs from PKG_MIRROR_HASH — patching Makefile so make"
            echo "download accepts our tarball (which has correct LFS content)."
            sed -i "s/^PKG_MIRROR_HASH:=.*/PKG_MIRROR_HASH:=${ACTUAL_HASH}/" \
              "${{ runner.temp }}/openwrt/$PACKAGE_MK"
            echo "Patched PKG_MIRROR_HASH to $ACTUAL_HASH"
          fi

      - name: Download package sources
        working-directory: ${{ runner.temp }}/openwrt
        env:
          FORCE_UNSAFE_CONFIGURE: 1
          TAR_OPTIONS: --no-same-owner
          LC_ALL: C
        run: |
          make download -j$(nproc) || {
            echo "Retrying..."
            sleep 60
            make download -j1 V=s
          }

      - name: Build OpenWrt
        working-directory: ${{ runner.temp }}/openwrt
        env:
          FORCE_UNSAFE_CONFIGURE: 1
          TAR_OPTIONS: --no-same-owner
          LC_ALL: C
        run: |
          exec > >(tee /tmp/openwrt-build.log) 2>&1
          make -j$(nproc) || {
            echo "Retrying..."
            sleep 60
            make -j1 V=s
          }

      - name: Extract imagebuilder tarball
        run: |
          TARBALL=$(find ${{ runner.temp }}/openwrt/bin -name "*imagebuilder*.tar.*" | head -1)
          echo "Found: $TARBALL"
          cp "$TARBALL" "$GITHUB_WORKSPACE/"
          ls -lh "$GITHUB_WORKSPACE/"*imagebuilder*.tar.*

      - name: Collect packages and target metadata
        run: |
          set -euo pipefail
          OPENWRT="${{ runner.temp }}/openwrt"
          ARCH="aarch64_cortex-a53"
          TARGET="mediatek/filogic"
          STAGING="${{ runner.temp }}/pkg-staging"

          # Staging layout matches the ASU-expected on-disk structure under
          # releases/{version}/ so the publish step is a plain rsync into
          # the releases branch:
          #
          #   packages/${ARCH}/feeds.conf                — feed name list
          #   packages/${ARCH}/{feed}/{index.json,*.apk} — per-feed APK feed
          #   targets/${TARGET}/{profiles.json,*.manifest,*.buildinfo,sha256sums}
          #   targets/${TARGET}/packages/{index.json,*.apk}  — target kmods
          #
          # ASU fetches packages from {upstream_url}/{path}/packages/{arch}/... and
          # target kmods from {upstream_url}/{path}/targets/{target}/packages/ —
          # where {path} is "releases/{version}" per branches.json.
          PKG_BASE=$(find "${OPENWRT}/bin" -type d -path "*packages/${ARCH}" | head -1)
          TARGET_BASE=$(find "${OPENWRT}/bin" -type d -path "*targets/${TARGET}" | head -1)

          echo "Packages base: ${PKG_BASE:-NOT FOUND}"
          echo "Targets base: ${TARGET_BASE:-NOT FOUND}"

          mkdir -p "${STAGING}/packages/${ARCH}" "${STAGING}/targets/${TARGET}/packages"

          # Arch-wide feed packages (base, luci, packages, routing, etc.)
          if [ -n "${PKG_BASE}" ]; then
            for FEED_DIR in "${PKG_BASE}"/*/; do
              [ -d "${FEED_DIR}" ] || continue
              FEED=$(basename "${FEED_DIR}")
              DEST="${STAGING}/packages/${ARCH}/${FEED}"
              mkdir -p "${DEST}"
              cp "${FEED_DIR}"*.apk "${DEST}/" 2>/dev/null || true
              cp "${FEED_DIR}"packages.adb "${DEST}/" 2>/dev/null || true
              cp "${FEED_DIR}"index.json "${DEST}/" 2>/dev/null || true
            done
          fi

          # feeds.conf tells ASU which feeds to enumerate. Format: opkg-style
          # three-column lines — ASU's parse_feeds_conf splits on whitespace
          # and takes the second column, so only the feed name matters.
          FEEDS_CONF="${STAGING}/packages/${ARCH}/feeds.conf"
          : > "${FEEDS_CONF}"
          for FEED_DIR in "${STAGING}/packages/${ARCH}"/*/; do
            [ -d "${FEED_DIR}" ] || continue
            FEED=$(basename "${FEED_DIR}")
            echo "src/apk ${FEED} ignored" >> "${FEEDS_CONF}"
          done
          echo "Generated feeds.conf:"
          cat "${FEEDS_CONF}"

          # Target kmods live under targets/${TARGET}/packages/ — ASU reads
          # them from there, not from packages/${ARCH}/kmods.
          if [ -n "${TARGET_BASE}" ] && [ -d "${TARGET_BASE}/packages" ]; then
            DEST="${STAGING}/targets/${TARGET}/packages"
            cp "${TARGET_BASE}/packages"/*.apk "${DEST}/" 2>/dev/null || true
            cp "${TARGET_BASE}/packages"/packages.adb "${DEST}/" 2>/dev/null || true
            cp "${TARGET_BASE}/packages"/index.json "${DEST}/" 2>/dev/null || true
          fi

          # Target metadata (profiles.json, buildinfo, manifests) sits alongside
          # the target's packages/ dir.
          if [ -n "${TARGET_BASE}" ]; then
            DEST="${STAGING}/targets/${TARGET}"
            for f in profiles.json config.buildinfo feeds.buildinfo version.buildinfo; do
              [ -f "${TARGET_BASE}/${f}" ] && cp "${TARGET_BASE}/${f}" "${DEST}/"
            done
            cp "${TARGET_BASE}"/*.manifest "${DEST}/" 2>/dev/null || true
          fi

          # sha256sums per package dir — not strictly required by ASU but useful
          # for debugging and mirror integrity checks.
          (cd "${STAGING}/packages/${ARCH}" && \
            find . -name '*.apk' -o -name 'packages.adb' -o -name 'index.json' | \
            sort | xargs sha256sum > sha256sums) 2>/dev/null || true
          (cd "${STAGING}/targets/${TARGET}/packages" && \
            find . -name '*.apk' -o -name 'packages.adb' -o -name 'index.json' | \
            sort | xargs sha256sum > sha256sums) 2>/dev/null || true

          PKG_COUNT=$(find "${STAGING}" -name '*.apk' | wc -l)
          echo "Total packages: ${PKG_COUNT}"
          if [ "${PKG_COUNT}" -eq 0 ]; then
            echo "::error::No packages found — check build output structure"
            find "${OPENWRT}/bin" -maxdepth 4 -type d | head -30
            exit 1
          fi

          echo "Staging layout:"
          find "${STAGING}" -maxdepth 4 -type d | sort

          # Bundle for artifact handoff to containerize job
          tar -czf "$GITHUB_WORKSPACE/packages-staging.tar.gz" \
            -C "${STAGING}" .

      - name: Generate firmware-packages.txt from pesa's manifest
        env:
          RELEASE_DIR: ${{ needs.discover.outputs.release_dir }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # The .manifest for the release we're rebuilding lists every package
          # pesa baked into his firmware. Using it here guarantees parity with
          # the config.buildinfo we just compiled against, so the resulting
          # ImageBuilder's DEFAULT_PACKAGES can never reference a package the
          # package repo doesn't have.
          MANIFEST_NAME=$(gh api \
            "repos/pesa1234/MT6000_cust_build/contents/${RELEASE_DIR}/targets/mediatek/filogic" \
            --jq '.[] | select(.name | endswith(".manifest")) | .name' | head -1)
          if [[ -z "$MANIFEST_NAME" ]]; then
            echo "::error::No .manifest found in pesa's release dir ${RELEASE_DIR}"
            exit 1
          fi
          MANIFEST_URL="https://raw.githubusercontent.com/pesa1234/MT6000_cust_build/refs/heads/main/${RELEASE_DIR}/targets/mediatek/filogic/${MANIFEST_NAME}"
          echo "Fetching manifest: ${MANIFEST_URL}"
          curl -fsSL "${MANIFEST_URL}" | awk '{print $1}' | sort -u > "$GITHUB_WORKSPACE/firmware-packages.txt"
          echo "Packages in manifest: $(wc -l < "$GITHUB_WORKSPACE/firmware-packages.txt")"

      - name: Upload firmware-packages artifact
        uses: actions/upload-artifact@v5
        with:
          name: firmware-packages
          path: firmware-packages.txt
          retention-days: 1

      - name: Upload profiles.json artifact
        uses: actions/upload-artifact@v5
        with:
          name: profiles-json
          path: ${{ runner.temp }}/pkg-staging/targets/mediatek/filogic/profiles.json
          retention-days: 1

      - name: Upload imagebuilder tarball as artifact
        uses: actions/upload-artifact@v5
        with:
          name: imagebuilder-tarball
          path: "*imagebuilder*.tar.*"
          retention-days: 1

      - name: Upload packages artifact
        uses: actions/upload-artifact@v5
        with:
          name: packages-staging
          path: packages-staging.tar.gz
          retention-days: 1

      - name: Cleanup openwrt build dir
        run: |
          # Preserve dl/ for actions/cache post-step, remove everything else
          if [ -d "${{ runner.temp }}/openwrt/dl" ] && [ ! -L "${{ runner.temp }}/openwrt/dl" ]; then
            mv "${{ runner.temp }}/openwrt/dl" "${{ runner.temp }}/openwrt-dl-cache"
          fi
          rm -rf ${{ runner.temp }}/openwrt
          if [ -d "${{ runner.temp }}/openwrt-dl-cache" ]; then
            mkdir -p ${{ runner.temp }}/openwrt
            mv "${{ runner.temp }}/openwrt-dl-cache" "${{ runner.temp }}/openwrt/dl"
          fi

      - name: Ping healthcheck failure with log
        if: failure()
        run: |
          LOG_TAIL=$(tail -c 8000 /tmp/openwrt-build.log 2>/dev/null || echo "No build log captured")
          curl -fsS -m 10 --retry 3 \
            --data-binary "Build failed: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }} ${LOG_TAIL}" \
            "https://hc-ping.com/${{ secrets.HEALTHCHECK_BUILD_UUID }}/fail" || true

  containerize:
    needs: [discover, build]
    runs-on: ${{ inputs.runner || 'ubuntu-latest' }}
    timeout-minutes: 30
    permissions:
      contents: write
      packages: write

    steps:
      - uses: actions/checkout@v5

      - name: Download imagebuilder tarball
        uses: actions/download-artifact@v5
        with:
          name: imagebuilder-tarball

      - name: Download packages artifact
        uses: actions/download-artifact@v5
        with:
          name: packages-staging

      - name: Download firmware-packages artifact into build context
        uses: actions/download-artifact@v5
        with:
          name: firmware-packages
          # Land at repo root so the Containerfile's COPY picks it up;
          # overwrites the committed fallback used by build-firmware.yml.
          path: .

      - name: Publish packages and metadata to releases branch
        if: needs.discover.outputs.asu_version != 'SKIP'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION="${{ needs.discover.outputs.asu_version }}-SNAPSHOT"

          rm -rf /tmp/pkg-staging /tmp/releases-branch
          mkdir -p /tmp/pkg-staging
          tar -xzf packages-staging.tar.gz -C /tmp/pkg-staging

          git clone --depth=1 --branch=releases \
            "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" \
            /tmp/releases-branch

          # Publish under {version}/ at the branch root — the path
          # branches.json tells ASU to consume. The branch itself is named
          # 'releases', so the raw.githubusercontent.com URL already contains
          # one /releases/ (the branch); nesting another releases/ directory
          # inside would duplicate it in every URL. Wipe first so stale
          # files don't linger across rebuilds.
          rm -rf "/tmp/releases-branch/${VERSION}"
          mkdir -p "/tmp/releases-branch/${VERSION}"
          cp -a /tmp/pkg-staging/. "/tmp/releases-branch/${VERSION}/"

          cd /tmp/releases-branch
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "${VERSION}/"
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "ci: publish packages and metadata for ${VERSION}"

          for i in 1 2 3; do
            git push origin releases && break
            echo "Push failed (attempt $i), retrying..."
            sleep 10
            git pull --rebase origin releases
          done

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute container tags
        id: tags
        run: |
          TAGS="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:mediatek-filogic-${{ needs.discover.outputs.branch }}"
          ASU_VER="${{ needs.discover.outputs.asu_version }}"
          if [[ "$ASU_VER" != "SKIP" ]]; then
            TAGS="${TAGS},${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:mediatek-filogic-openwrt-${ASU_VER}"
          fi
          echo "tags=$TAGS" >> "$GITHUB_OUTPUT"

      - name: Build and push (${{ needs.discover.outputs.branch }})
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Containerfile
          push: true
          build-args: |
            REPO_VERSION_URL=https://raw.githubusercontent.com/${{ github.repository }}/refs/heads/releases/${{ needs.discover.outputs.asu_version }}-SNAPSHOT
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Create release to record built commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="mediatek-filogic-${{ needs.discover.outputs.branch }}"
          gh release delete "${TAG}" --cleanup-tag -y --repo "${{ github.repository }}" 2>/dev/null || true
          VERSION="${{ needs.discover.outputs.asu_version }}-SNAPSHOT"
          gh release create "${TAG}" \
            --repo "${{ github.repository }}" \
            --title "ImageBuilder: ${{ needs.discover.outputs.branch }}" \
            --notes "**Branch:** ${{ needs.discover.outputs.branch }}
          **Commit:** ${{ needs.discover.outputs.commit_sha }}
          **Version:** ${VERSION}
          **Image:** \`${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${TAG}\`
          **Packages:** https://raw.githubusercontent.com/${{ github.repository }}/releases/${VERSION}/packages/" \
            packages-staging.tar.gz

      # profiles.json is already included in the git-based publish above
      # (staged under releases/{version}/targets/mediatek/filogic/) so no
      # separate API PUT is needed.

      - name: Ping healthcheck failure
        if: failure()
        run: |
          curl -fsS -m 10 --retry 3 \
            --data-binary "Containerize failed: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            "https://hc-ping.com/${{ secrets.HEALTHCHECK_BUILD_UUID }}/fail" || true
