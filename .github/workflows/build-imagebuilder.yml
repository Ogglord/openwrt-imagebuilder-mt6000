name: Build ImageBuilder Containers

on:
  schedule:
    - cron: "0 4 * * 0" # Weekly Sunday 04:00 UTC
  workflow_dispatch:
    inputs:
      force_branch:
        description: "Force build a specific branch (leave empty for auto-discover)"
        required: false
        type: string
      use_self_hosted:
        description: "Run build on self-hosted runner"
        required: true
        default: false
        type: boolean

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ogglord/openwrt-imagebuilder

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      branch: ${{ steps.discover.outputs.branch }}
      commit_sha: ${{ steps.discover.outputs.commit_sha }}
      new_commits: ${{ steps.discover.outputs.new_commits }}
    steps:
      - name: Discover latest branch and check for new commits
        id: discover
        env:
          FORCE_BRANCH: ${{ inputs.force_branch }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          if [[ -n "${FORCE_BRANCH:-}" ]]; then
            echo "Force building branch: $FORCE_BRANCH"
            LATEST_SHA=$(gh api "repos/pesa1234/openwrt/commits/${FORCE_BRANCH}" --jq .sha)
            echo "branch=${FORCE_BRANCH}" >> "$GITHUB_OUTPUT"
            echo "commit_sha=${LATEST_SHA}" >> "$GITHUB_OUTPUT"
            echo "new_commits=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # List directories in MT6000_cust_build and pick the latest
          DIRS=$(curl -fsSL "https://api.github.com/repos/pesa1234/MT6000_cust_build/contents/" \
            -H "Accept: application/vnd.github.v3+json" | \
            jq -r '.[] | select(.type == "dir") | .name' | \
            grep -E '^[0-9]{4}' || true)

          if [[ -z "$DIRS" ]]; then
            echo "No release directories found"
            echo "new_commits=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          LATEST_BRANCH=$(echo "$DIRS" | sort | tail -1 | sed -E 's/^[0-9]{4}[._-][0-9]{2}[._-][0-9]{2}_r[0-9]+-?[a-f0-9]*_//')
          echo "Latest branch: $LATEST_BRANCH"

          # Get the latest commit SHA from pesa's repo for this branch
          LATEST_SHA=$(gh api "repos/pesa1234/openwrt/commits/${LATEST_BRANCH}" --jq .sha)
          echo "Latest commit SHA: $LATEST_SHA"

          # Check if we already built this commit (SHA stored in per-branch release body)
          TAG="mediatek-filogic-${LATEST_BRANCH}"
          ALREADY_BUILT=$(gh api "repos/${{ github.repository }}/releases/tags/${TAG}" --jq .body 2>/dev/null | grep -c "${LATEST_SHA}" || true)

          if [[ "$ALREADY_BUILT" -gt 0 ]]; then
            echo "Commit ${LATEST_SHA} already built — skipping"
            echo "new_commits=false" >> "$GITHUB_OUTPUT"
          else
            echo "New commit detected — will build"
            echo "new_commits=true" >> "$GITHUB_OUTPUT"
          fi

          echo "branch=${LATEST_BRANCH}" >> "$GITHUB_OUTPUT"
          echo "commit_sha=${LATEST_SHA}" >> "$GITHUB_OUTPUT"


  build:
    needs: discover
    if: needs.discover.outputs.new_commits == 'true'
    runs-on: "${{ inputs.use_self_hosted == true && 'self-hosted' || 'ubuntu-latest' }}"
    timeout-minutes: 360

    steps:
      - name: Ping healthcheck start
        run: curl -fsS -m 10 --retry 3 "https://hc-ping.com/${{ secrets.HEALTHCHECK_BUILD_UUID }}/start" || true

      - uses: actions/checkout@v4

      - name: Free disk space
        if: inputs.use_self_hosted == false
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: false
          docker-images: true
          swap-storage: true

      - name: Install build dependencies
        if: inputs.use_self_hosted == false
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential clang flex bison g++ gawk gcc-multilib \
            g++-multilib gettext git libncurses-dev libssl-dev \
            python3-setuptools rsync swig unzip \
            zlib1g-dev file wget curl zstd
          sudo apt-get autoremove -y && sudo apt-get clean -y

      - name: Clean previous build
        if: inputs.use_self_hosted == true
        run: rm -rf ${{ runner.temp }}/openwrt

      - name: Clone OpenWrt source
        run: |
          git clone --depth 1 -b "${{ needs.discover.outputs.branch }}" \
            https://github.com/pesa1234/openwrt.git ${{ runner.temp }}/openwrt

      - name: Update and install feeds
        working-directory: ${{ runner.temp }}/openwrt
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          ./scripts/feeds install -a

      - name: Patch Makefile defaults to match openssl build
        working-directory: ${{ runner.temp }}/openwrt
        run: |
          # This build uses openssl variants; patch the imagebuilder metadata so
          # DEFAULT_PACKAGES reflects what was actually compiled (not mbedtls).
          sed -i 's/wpad-basic-mbedtls/wpad-openssl/g' target/linux/mediatek/filogic/target.mk
          sed -i 's/libustream-mbedtls/libustream-openssl/g' include/target.mk
          sed -i 's/apk-mbedtls/apk-openssl/g' include/default-packages.mk

      - name: Download and apply config
        working-directory: ${{ runner.temp }}/openwrt
        run: |
          if echo "${{ needs.discover.outputs.branch }}" | grep -q "test6.18"; then
            CONFIG_URL="https://raw.githubusercontent.com/pesa1234/MT6000_cust_build/refs/heads/main/config_file/test6.18/.config"
          else
            CONFIG_URL="https://raw.githubusercontent.com/pesa1234/MT6000_cust_build/refs/heads/main/config_file/.config"
          fi
          echo "Fetching config from: ${CONFIG_URL}"
          curl -fsSL "${CONFIG_URL}" -o .config
          echo "CONFIG_IB=y" >> .config
          echo "CONFIG_IB_STANDALONE=y" >> .config
          sed -i '/CONFIG_BPF_TOOLCHAIN/d' .config
          sed -i '/CONFIG_USE_LLVM_HOST/d' .config
          echo "CONFIG_BPF_TOOLCHAIN_HOST=y" >> .config
          echo "CONFIG_USE_LLVM_HOST=y" >> .config
          echo "LLVM tools on PATH:"
          llvm-config --version || llvm-config-18 --version || echo "llvm-config not found"
          which llvm-config llvm-config-18 clang clang-18 2>/dev/null || true
          LLVM_BINDIR=$(llvm-config --bindir 2>/dev/null || llvm-config-18 --bindir 2>/dev/null || echo "/usr/bin")
          LLVM_PATH="${LLVM_BINDIR%/bin}"
          echo "Using LLVM_PATH: ${LLVM_PATH}"
          echo "CONFIG_BPF_TOOLCHAIN_HOST_PATH=\"${LLVM_PATH}\"" >> .config
          echo "CONFIG_PACKAGE_nordvpnlite=n" >> .config
          echo "CONFIG_PACKAGE_onionshare-cli=n" >> .config
          make defconfig
          # Set version to the branch name so firmware reports a specific version
          # instead of "SNAPSHOT". This allows ASU to resolve the correct
          # imagebuilder container tag without custom patches.
          # Done after defconfig so it cannot be overridden by defaults.
          sed -i '/^CONFIG_VERSION_NUMBER=/d' .config
          echo "CONFIG_VERSION_NUMBER=\"${{ needs.discover.outputs.branch }}\"" >> .config
        env:
          FORCE_UNSAFE_CONFIGURE: 1
          LC_ALL: C

      - name: Inject APK signing key
        working-directory: ${{ runner.temp }}/openwrt
        env:
          PACKAGE_SIGNING_KEY: ${{ secrets.PACKAGE_SIGNING_KEY }}
          PACKAGE_SIGNING_KEY_PUB: ${{ secrets.PACKAGE_SIGNING_KEY_PUB }}
        run: |
          set -euo pipefail

          # Write RSA keypair for build-time package signing
          printf '%s\n' "${PACKAGE_SIGNING_KEY}" > key-build.rsa
          chmod 600 key-build.rsa
          printf '%s\n' "${PACKAGE_SIGNING_KEY_PUB}" > key-build.rsa.pub

          # Embed public key in firmware rootfs so APK trusts our packages on-device
          mkdir -p files/etc/apk/keys
          cp key-build.rsa.pub files/etc/apk/keys/pesabuilder-signing.rsa.pub

          echo "Signing key injected, public key embedded in firmware at files/etc/apk/keys/"

      - name: Pre-fetch linux-firmware via git-lfs
        run: |
          # pesa1234/linux-firmware uses git-lfs for binary blobs. The OpenWrt
          # download fallback uses `git archive` which omits LFS content, producing
          # a wrong hash. We clone with LFS here and pack the tarball manually so
          # make download finds a correctly-hashed file in dl/ and skips re-downloading.
          PACKAGE_MK="${{ runner.temp }}/openwrt/package/firmware/linux-firmware/Makefile"
          if [ ! -f "$PACKAGE_MK" ]; then
            echo "Package makefile not found, skipping pre-fetch"
            exit 0
          fi
          VERSION=$(grep -E '^PKG_VERSION' "$PACKAGE_MK" | head -1 | cut -d= -f2 | tr -d ' ')
          HASH=$(grep -E '^PKG_HASH' "$PACKAGE_MK" | head -1 | cut -d= -f2 | tr -d ' ')
          PKG_COMMIT=$(grep -E '^PKG_SOURCE_VERSION' "$PACKAGE_MK" | head -1 | cut -d= -f2 | tr -d ' ')
          if [[ -z "$VERSION" || -z "$PKG_COMMIT" ]]; then
            echo "Could not parse VERSION or PKG_SOURCE_VERSION from $PACKAGE_MK — skipping pre-fetch"
            echo "Makefile contents:"
            cat "$PACKAGE_MK"
            exit 0
          fi
          SOURCE="linux-firmware-${VERSION}.tar.zst"
          DL_DIR="${{ runner.temp }}/openwrt/dl"
          mkdir -p "$DL_DIR"
          if [ -f "$DL_DIR/$SOURCE" ]; then
            echo "Already present in dl/: $SOURCE"
            exit 0
          fi
          echo "Cloning pesa1234/linux-firmware at version $VERSION ($PKG_COMMIT) with LFS..."
          git clone --filter=blob:none https://github.com/pesa1234/linux-firmware.git "${{ runner.temp }}/linux-firmware-src"
          cd "${{ runner.temp }}/linux-firmware-src"
          git checkout "$PKG_COMMIT"
          git lfs pull
          SUBDIR="linux-firmware-${VERSION}"
          TAR_TIMESTAMP=$(git log -1 --no-show-signature --format='@%ct')
          cd "${{ runner.temp }}"
          mkdir -p "$SUBDIR"
          cp -a linux-firmware-src/. "$SUBDIR/"
          rm -rf "$SUBDIR/.git" "$SUBDIR/.gitmodules"
          tar --numeric-owner --owner=0 --group=0 --mode=a-s --sort=name \
            --mtime="$TAR_TIMESTAMP" -c "$SUBDIR" | \
            zstd -T0 --ultra -20 -c > "$DL_DIR/$SOURCE"
          rm -rf "$SUBDIR" linux-firmware-src
          ACTUAL_HASH=$(sha256sum "$DL_DIR/$SOURCE" | cut -d' ' -f1)
          if [ -z "$HASH" ]; then
            echo "No PKG_HASH in Makefile — skipping hash verification, keeping pre-fetched file"
          elif [ "$ACTUAL_HASH" != "$HASH" ]; then
            echo "WARNING: hash mismatch after LFS pre-fetch (got $ACTUAL_HASH, expected $HASH)"
            echo "Removing so make download can attempt its own fallback"
            rm "$DL_DIR/$SOURCE"
          else
            echo "Hash verified: $SOURCE"
          fi

      - name: Download package sources
        working-directory: ${{ runner.temp }}/openwrt
        env:
          FORCE_UNSAFE_CONFIGURE: 1
          TAR_OPTIONS: --no-same-owner
          LC_ALL: C
        run: |
          make download -j$(nproc) || {
            echo "Retrying..."
            sleep 60
            make download -j1 V=s
          }

      - name: Build OpenWrt
        working-directory: ${{ runner.temp }}/openwrt
        env:
          FORCE_UNSAFE_CONFIGURE: 1
          TAR_OPTIONS: --no-same-owner
          LC_ALL: C
        run: |
          exec > >(tee /tmp/openwrt-build.log) 2>&1
          make -j$(nproc) || {
            echo "Retrying..."
            sleep 60
            make -j1 V=s
          }

      - name: Extract imagebuilder tarball
        run: |
          TARBALL=$(find ${{ runner.temp }}/openwrt/bin -name "*imagebuilder*.tar.*" | head -1)
          echo "Found: $TARBALL"
          cp "$TARBALL" "$GITHUB_WORKSPACE/"
          ls -lh "$GITHUB_WORKSPACE/"*imagebuilder*.tar.*

      - name: Collect packages and target metadata
        run: |
          set -euo pipefail
          OPENWRT="${{ runner.temp }}/openwrt"
          ARCH="aarch64_cortex-a53"
          STAGING="${{ runner.temp }}/pkg-staging"

          mkdir -p "${STAGING}/packages/${ARCH}"

          # Copy feed packages as-is (already signed with our key by make)
          for FEED_DIR in "${OPENWRT}/bin/packages/${ARCH}"/*/; do
            FEED=$(basename "${FEED_DIR}")
            DEST="${STAGING}/packages/${ARCH}/${FEED}"
            mkdir -p "${DEST}"
            cp "${FEED_DIR}"*.apk "${DEST}/" 2>/dev/null || true
            cp "${FEED_DIR}"packages.adb "${DEST}/" 2>/dev/null || true
            cp "${FEED_DIR}"index.json "${DEST}/" 2>/dev/null || true
          done

          # Collect target packages (kmods)
          TARGET_PKGS="${OPENWRT}/bin/targets/mediatek/filogic/packages"
          if [ -d "${TARGET_PKGS}" ]; then
            DEST="${STAGING}/packages/${ARCH}/kmods"
            mkdir -p "${DEST}"
            cp "${TARGET_PKGS}"/*.apk "${DEST}/" 2>/dev/null || true
            cp "${TARGET_PKGS}"/packages.adb "${DEST}/" 2>/dev/null || true
            cp "${TARGET_PKGS}"/index.json "${DEST}/" 2>/dev/null || true
          fi

          # Generate sha256sums for packages
          (cd "${STAGING}/packages/${ARCH}" && \
            find . -name '*.apk' -o -name 'packages.adb' -o -name 'index.json' | \
            sort | xargs sha256sum > sha256sums)

          echo "Total packages: $(find "${STAGING}/packages" -name '*.apk' | wc -l)"

          # Collect target metadata (profiles.json, buildinfo, etc.)
          TARGET_DIR="${OPENWRT}/bin/targets/mediatek/filogic"
          for f in profiles.json config.buildinfo feeds.buildinfo version.buildinfo sha256sums; do
            [ -f "${TARGET_DIR}/${f}" ] && cp "${TARGET_DIR}/${f}" "${STAGING}/"
          done
          # Copy the device manifest if present
          cp "${TARGET_DIR}"/*.manifest "${STAGING}/" 2>/dev/null || true

          echo "Collected metadata:"
          ls -lh "${STAGING}"/*.json "${STAGING}"/*.buildinfo 2>/dev/null || true

          # Bundle for artifact handoff to containerize job
          tar -czf "$GITHUB_WORKSPACE/packages-staging.tar.gz" \
            -C "${STAGING}" .

      - name: Upload imagebuilder tarball as artifact
        uses: actions/upload-artifact@v4
        with:
          name: imagebuilder-tarball
          path: "*imagebuilder*.tar.*"
          retention-days: 1

      - name: Upload packages artifact
        uses: actions/upload-artifact@v4
        with:
          name: packages-staging
          path: packages-staging.tar.gz
          retention-days: 1

      - name: Cleanup openwrt build dir
        run: rm -rf ${{ runner.temp }}/openwrt

      - name: Ping healthcheck failure with log
        if: failure()
        run: |
          LOG_TAIL=$(tail -c 8000 /tmp/openwrt-build.log 2>/dev/null || echo "No build log captured")
          curl -fsS -m 10 --retry 3 \
            --data-binary "Build failed: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }} ${LOG_TAIL}" \
            "https://hc-ping.com/${{ secrets.HEALTHCHECK_BUILD_UUID }}/fail" || true

  containerize:
    needs: [discover, build]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Download imagebuilder tarball
        uses: actions/download-artifact@v4
        with:
          name: imagebuilder-tarball

      - name: Download packages artifact
        uses: actions/download-artifact@v4
        with:
          name: packages-staging

      - name: Publish packages and metadata to releases branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="mediatek-filogic-${{ needs.discover.outputs.branch }}"

          mkdir -p /tmp/pkg-staging
          tar -xzf packages-staging.tar.gz -C /tmp/pkg-staging

          git clone --depth=1 --branch=releases \
            "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" \
            /tmp/releases-branch

          # Replace build output for this tag (idempotent on re-run)
          rm -rf "/tmp/releases-branch/targets/${TAG}"
          mkdir -p "/tmp/releases-branch/targets/${TAG}"
          cp -a /tmp/pkg-staging/. "/tmp/releases-branch/targets/${TAG}/"

          # Prune: keep only the 3 most recent tag directories
          cd /tmp/releases-branch/targets
          ls -t | tail -n +4 | xargs -r rm -rf

          cd /tmp/releases-branch
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add targets/
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "ci: publish packages and metadata for ${TAG}"

          for i in 1 2 3; do
            git push origin releases && break
            echo "Push failed (attempt $i), retrying..."
            sleep 10
            git pull --rebase origin releases
          done

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push (${{ needs.discover.outputs.branch }})
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Containerfile
          push: true
          build-args: |
            PACKAGES_BASE_URL=https://raw.githubusercontent.com/${{ github.repository }}/releases/targets/mediatek-filogic-${{ needs.discover.outputs.branch }}/packages/aarch64_cortex-a53
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:mediatek-filogic-${{ needs.discover.outputs.branch }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:mediatek-filogic-openwrt-${{ needs.discover.outputs.branch }}

      - name: Create release to record built commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="mediatek-filogic-${{ needs.discover.outputs.branch }}"
          gh release delete "${TAG}" --cleanup-tag -y --repo "${{ github.repository }}" 2>/dev/null || true
          gh release create "${TAG}" \
            --repo "${{ github.repository }}" \
            --title "ImageBuilder: ${{ needs.discover.outputs.branch }}" \
            --notes "**Branch:** ${{ needs.discover.outputs.branch }}
          **Commit:** ${{ needs.discover.outputs.commit_sha }}
          **Image:** \`${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${TAG}\`
          **Packages:** https://raw.githubusercontent.com/${{ github.repository }}/releases/targets/${TAG}/packages/" \
            packages-staging.tar.gz

      - name: Ping healthcheck failure
        if: failure()
        run: |
          curl -fsS -m 10 --retry 3 \
            --data-binary "Containerize failed: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            "https://hc-ping.com/${{ secrets.HEALTHCHECK_BUILD_UUID }}/fail" || true
