name: 2. Containerize & Publish
run-name: "Containerize — ${{ github.event.workflow_run.display_title || inputs.build_run_id || 'latest successful build' }}"

# Split out of build-imagebuilder.yml so the ~2min container step can be
# re-run independently of the ~40min `make world`. Two triggers:
#
#  - workflow_run on a successful Build ImageBuilder run → auto-containerize
#    with artifacts from that run, then rebuild branches.json.
#  - workflow_dispatch → manual; build_run_id selects the build (blank =
#    latest successful); branch_filter scopes the metadata publish.
on:
  workflow_run:
    workflows: ["1. Build ImageBuilder"]
    types: [completed]
  workflow_dispatch:
    inputs:
      build_run_id:
        description: "Build run ID to containerize (blank = latest successful)"
        required: false
        type: string
      branch_filter:
        description: "Only include a specific branch key in metadata publish (blank = all)"
        required: false
        type: string

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ogglord/openwrt-imagebuilder

jobs:
  containerize:
    # Skip the auto-trigger if the underlying build failed — manual dispatch
    # always proceeds (the resolve step will fail loudly if there's nothing
    # to pull).
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      packages: write
      actions: read

    steps:
      - uses: actions/checkout@v5

      - name: Resolve build run ID
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          WORKFLOW_RUN_ID: ${{ github.event.workflow_run.id }}
          INPUT_RUN_ID: ${{ inputs.build_run_id }}
        run: |
          set -euo pipefail
          case "$EVENT_NAME" in
            workflow_run)
              RUN_ID="$WORKFLOW_RUN_ID"
              echo "Auto-triggered by Build ImageBuilder run: $RUN_ID" ;;
            workflow_dispatch)
              if [[ -n "${INPUT_RUN_ID:-}" ]]; then
                RUN_ID="$INPUT_RUN_ID"
                echo "Using user-supplied build_run_id: $RUN_ID"
              else
                RUN_ID=$(gh run list --repo "${{ github.repository }}" \
                  --workflow build-imagebuilder.yml --status success \
                  --limit 1 --json databaseId --jq '.[0].databaseId')
                echo "Resolved latest successful build_run_id: $RUN_ID"
              fi ;;
          esac
          if [[ -z "${RUN_ID:-}" ]]; then
            echo "::error::Could not resolve a build run id"
            exit 1
          fi
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"
          # Check if the build actually produced artifacts — it may have been
          # skipped (already built). Exit cleanly rather than failing on a missing artifact.
          ARTIFACT_COUNT=$(gh api "repos/${{ github.repository }}/actions/runs/${RUN_ID}/artifacts" \
            --jq '[.artifacts[] | select(.name == "build-tarballs")] | length')
          if [[ "$ARTIFACT_COUNT" -eq 0 ]]; then
            echo "No build-tarballs artifact in run ${RUN_ID} — build was skipped (already built). Nothing to containerize."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Download artifact — build-tarballs
        if: steps.resolve.outputs.skip != 'true'
        uses: actions/download-artifact@v5
        with:
          name: build-tarballs
          run-id: ${{ steps.resolve.outputs.run_id }}
          github-token: ${{ github.token }}

      - name: Download artifact — packages-staging
        if: steps.resolve.outputs.skip != 'true'
        uses: actions/download-artifact@v5
        with:
          name: packages-staging
          run-id: ${{ steps.resolve.outputs.run_id }}
          github-token: ${{ github.token }}

      - name: Download artifact — firmware-packages (into build context)
        if: steps.resolve.outputs.skip != 'true'
        uses: actions/download-artifact@v5
        with:
          # Land at repo root so the Containerfile's COPY picks it up,
          # overwriting the committed fallback used by build-firmware.yml.
          name: firmware-packages
          path: .
          run-id: ${{ steps.resolve.outputs.run_id }}
          github-token: ${{ github.token }}

      - name: Download artifact — build-meta
        if: steps.resolve.outputs.skip != 'true'
        uses: actions/download-artifact@v5
        with:
          name: build-meta
          run-id: ${{ steps.resolve.outputs.run_id }}
          github-token: ${{ github.token }}

      - name: Load build metadata
        if: steps.resolve.outputs.skip != 'true'
        id: meta
        run: |
          set -euo pipefail
          test -f build-meta.json || { echo "::error::build-meta.json missing from artifact"; exit 1; }
          cat build-meta.json
          jq -r '"branch=" + .branch,
                 "asu_version=" + .asu_version,
                 "commit_sha=" + .commit_sha,
                 "release_dir=" + .release_dir' build-meta.json >> "$GITHUB_OUTPUT"

      - name: Publish packages and metadata to releases branch
        if: steps.resolve.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          ASU_VERSION: ${{ steps.meta.outputs.asu_version }}
        run: |
          set -euo pipefail
          VERSION="${ASU_VERSION}"

          rm -rf /tmp/pkg-staging /tmp/releases-branch
          mkdir -p /tmp/pkg-staging
          tar -xzf packages-staging.tar.gz -C /tmp/pkg-staging

          git clone --depth=1 --branch=releases \
            "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" \
            /tmp/releases-branch

          # Publish at the branch root under {version}/ — branches.json
          # tells ASU to consume the same path. Wipe first so stale files
          # don't linger across rebuilds.
          rm -rf "/tmp/releases-branch/${VERSION}"
          mkdir -p "/tmp/releases-branch/${VERSION}"
          cp -a /tmp/pkg-staging/. "/tmp/releases-branch/${VERSION}/"

          cd /tmp/releases-branch
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "${VERSION}/"
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "ci: publish packages and metadata for ${VERSION}"

          # Retry with rebase to survive concurrent pushes to releases.
          for i in 1 2 3; do
            git push origin releases && break
            echo "Push failed (attempt $i), retrying..."
            sleep 10
            git pull --rebase origin releases
          done

      - name: Set up Docker Buildx
        if: steps.resolve.outputs.skip != 'true'
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: steps.resolve.outputs.skip != 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute container tags
        if: steps.resolve.outputs.skip != 'true'
        id: tags
        env:
          BRANCH: ${{ steps.meta.outputs.branch }}
          ASU_VER: ${{ steps.meta.outputs.asu_version }}
        run: |
          TAGS="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:mediatek-filogic-${BRANCH}"
          TAGS="${TAGS},${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:mediatek-filogic-v${ASU_VER}"
          echo "tags=$TAGS" >> "$GITHUB_OUTPUT"

      - name: Build and push ImageBuilder container
        if: steps.resolve.outputs.skip != 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Containerfile
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Create release to record built commit
        if: steps.resolve.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ steps.meta.outputs.branch }}
          COMMIT_SHA: ${{ steps.meta.outputs.commit_sha }}
          ASU_VERSION: ${{ steps.meta.outputs.asu_version }}
        run: |
          TAG="mediatek-filogic-${BRANCH}"
          gh release delete "${TAG}" --cleanup-tag -y --repo "${{ github.repository }}" 2>/dev/null || true
          VERSION="${ASU_VERSION}"
          gh release create "${TAG}" \
            --repo "${{ github.repository }}" \
            --title "ImageBuilder: ${BRANCH}" \
            --notes "**Branch:** ${BRANCH}
          **Commit:** ${COMMIT_SHA}
          **Version:** ${VERSION}
          **Image:** \`${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${TAG}\`
          **Packages:** https://raw.githubusercontent.com/${{ github.repository }}/releases/${VERSION}/packages/" \
            packages-staging.tar.gz \
            *sdk*.tar.*

      # profiles.json is already included in the git-based publish above
      # (staged under releases/{version}/targets/mediatek/filogic/) so no
      # separate API PUT is needed.

  publish-metadata:
    needs: containerize
    if: ${{ !cancelled() && needs.containerize.result != 'failure' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - name: Rebuild branches.json and metadata on releases branch
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH_FILTER: ${{ inputs.branch_filter }}
        run: |
          set -euo pipefail

          # Dedupe by X.Y key — keep most-recently published release per key.
          RELEASES=$(gh api "repos/${{ github.repository }}/releases" --paginate \
            | jq -r '
              [.[]
                | select(.tag_name | startswith("mediatek-filogic-"))
                | {pesa: (.tag_name | sub("^mediatek-filogic-"; "")),
                   published_at}]
              | group_by(.pesa | sub("^next-r"; "") | split(".") | .[0:2] | join("."))
              | map(sort_by(.published_at) | last | .pesa)
              | .[]
            ' || true)

          if [[ -z "$RELEASES" ]]; then
            echo "No releases found — nothing to publish"
            exit 0
          fi

          if [[ -n "${BRANCH_FILTER:-}" ]]; then
            RELEASES=$(echo "$RELEASES" | grep "^${BRANCH_FILTER}$" || true)
            if [[ -z "$RELEASES" ]]; then
              echo "No matching releases for filter '${BRANCH_FILTER}'"
              exit 0
            fi
          fi

          ARCH="aarch64_cortex-a53"
          mkdir -p entries-out targets-out

          while IFS= read -r PESA_BRANCH; do
            ASU_KEY=$(echo "$PESA_BRANCH" | sed 's/^next-r//' | cut -d. -f1,2)
            ASU_VER=$(echo "$PESA_BRANCH" | sed 's/^next-r//' | cut -d. -f1,2,3)
            echo "Processing: ${PESA_BRANCH} → key=${ASU_KEY} ver=${ASU_VER}"

            jq -n \
              --arg key "$ASU_KEY" \
              --arg ver "$ASU_VER" \
              --arg arch "$ARCH" \
              '{
                ($key): {
                  name: $ver,
                  version: $ver,
                  enabled: true,
                  snapshot: false,
                  path: "{version}",
                  path_packages: "DEPRECATED",
                  package_changes: [],
                  targets: {"mediatek/filogic": $arch}
                }
              }' > "entries-out/entry-${ASU_KEY}.json"

            jq -n --arg arch "$ARCH" '{"mediatek/filogic": $arch}' \
              > "targets-out/${ASU_VER}.targets.json"
          done <<< "$RELEASES"

          jq -s 'add | to_entries | sort_by(.key) | from_entries' entries-out/entry-*.json \
            > branches.json
          echo "branches.json:"
          cat branches.json

          VERSIONS=$(jq -r '[.[].version] | .[]' branches.json | sort -rV)
          LATEST=$(echo "$VERSIONS" | head -1)
          jq -n \
            --arg upcoming "$LATEST" \
            --arg stable   "$LATEST" \
            --argjson versions_list "$(echo "$VERSIONS" | jq -R . | jq -sc .)" \
            '{upcoming_version:$upcoming, stable_version:$stable, oldstable_version:"", versions_list:$versions_list}' \
            > .versions.json

          # Ensure releases branch exists before cloning.
          gh api "repos/${{ github.repository }}/git/refs/heads/releases" 2>/dev/null || \
            gh api "repos/${{ github.repository }}/git/refs" \
              --method POST \
              --field ref="refs/heads/releases" \
              --field sha="$(git rev-parse HEAD)"

          git clone --depth=1 --branch=releases \
            "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" \
            /tmp/releases-branch

          cd /tmp/releases-branch
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          cp "$GITHUB_WORKSPACE/branches.json" branches.json
          cp "$GITHUB_WORKSPACE/.versions.json" .versions.json
          git add branches.json .versions.json

          for targets_file in "$GITHUB_WORKSPACE"/targets-out/*.targets.json; do
            VER=$(basename "$targets_file" .targets.json)
            mkdir -p "${VER}"
            cp "$targets_file" "${VER}/.targets.json"
            git add "${VER}/.targets.json"
          done

          git diff --cached --quiet && echo "No changes to publish" && exit 0
          git commit -m "ci: publish branches.json and metadata"

          for i in 1 2 3; do
            git push origin releases && break
            echo "Push failed (attempt $i), retrying..."
            sleep 10
            git pull --rebase origin releases
          done

          echo "=== Metadata published ==="
          echo "URL: https://raw.githubusercontent.com/${{ github.repository }}/releases/.versions.json"
