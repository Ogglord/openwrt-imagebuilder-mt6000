name: 4. Healthcheck Report

on:
  # Fires on Containerize completion so "success" means the full pipeline
  # is green (build + publish + container push). Build-only failures are
  # already reported by the in-workflow step in build-imagebuilder.yml.
  workflow_run:
    workflows: ["2. Containerize"]
    types: [completed]

jobs:
  ping-success:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    steps:
      - run: curl -fsS -m 10 --retry 5 "https://hc-ping.com/${{ secrets.HEALTHCHECK_BUILD_UUID }}" || true

  ping-failure:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'failure' }}
    steps:
      - run: |
          curl -fsS -m 10 --retry 5 \
            --data-raw "Build failed: ${{ github.event.workflow_run.html_url }}" \
            "https://hc-ping.com/${{ secrets.HEALTHCHECK_BUILD_UUID }}/fail" || true
