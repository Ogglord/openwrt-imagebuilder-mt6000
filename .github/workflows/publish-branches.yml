name: 3. Create Metadata

on:
  # Fires after Containerize (which is itself triggered by Build ImageBuilder)
  # so the GH release containerize just created is visible when we enumerate
  # releases to rebuild branches.json.
  workflow_run:
    workflows: ["2. Containerize"]
    types: [completed]
  workflow_dispatch:
    inputs:
      branch_filter:
        description: "Only include a specific branch key (leave empty to rebuild from all releases)"
        required: false
        type: string

jobs:
  list:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    outputs:
      matrix: ${{ steps.list.outputs.matrix }}
    steps:
      - name: List built branches from releases
        id: list
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH_FILTER: ${{ inputs.branch_filter }}
        run: |
          set -euo pipefail

          # Dedupe by ASU X.Y key (next-r4.7.4 and next-r4.7.5 both → 4.7):
          # keep only the most recently published release per key so
          # branches.json / GHCR tags / releases-branch artifacts all agree on
          # one winner per X.Y. Most-recent wins.
          RELEASES=$(gh api "repos/${{ github.repository }}/releases" --paginate \
            | jq -r '
              [.[]
                | select(.tag_name | startswith("mediatek-filogic-"))
                | {pesa: (.tag_name | sub("^mediatek-filogic-"; "")),
                   published_at}]
              | group_by(.pesa | sub("^next-r"; "") | split(".") | .[0:2] | join("."))
              | map(sort_by(.published_at) | last | .pesa)
              | .[]
            ' || true)

          if [[ -z "$RELEASES" ]]; then
            echo "No releases found"
            echo 'matrix=[]' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ -n "${BRANCH_FILTER:-}" ]]; then
            RELEASES=$(echo "$RELEASES" | grep "^${BRANCH_FILTER}$" || true)
          fi

          if [[ -z "$RELEASES" ]]; then
            echo "No matching releases found"
            echo 'matrix=[]' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          MATRIX=$(echo "$RELEASES" | jq -R . | jq -sc .)
          echo "matrix=${MATRIX}" >> "$GITHUB_OUTPUT"
          echo "Branches to process: $MATRIX"

  resolve:
    needs: list
    if: needs.list.outputs.matrix != '[]'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        branch_key: ${{ fromJson(needs.list.outputs.matrix) }}
      fail-fast: false
    steps:
      - name: Build branch entry and metadata files
        run: |
          PESA_BRANCH="${{ matrix.branch_key }}"

          # Derive ASU X.Y branch key and X.Y.Z version:
          #   next-r4.7.4.rss.mtk → key=4.7  ver=4.7.4
          #   next-r4.8.0.rss.mtk-test6.18 → key=4.8  ver=4.8.0
          ASU_KEY=$(echo "$PESA_BRANCH" | sed 's/^next-r//' | cut -d. -f1,2)
          ASU_VER=$(echo "$PESA_BRANCH" | sed 's/^next-r//' | cut -d. -f1,2,3)
          VERSION="${ASU_VER}"

          ARCH="aarch64_cortex-a53"

          echo "Pesa branch: $PESA_BRANCH"
          echo "ASU key:     $ASU_KEY"
          echo "ASU version: $ASU_VER"
          echo "Version:     $VERSION"

          mkdir -p output

          # branches.json entry — key is X.Y (branch), version is X.Y.Z (stable)
          jq -n \
            --arg key "$ASU_KEY" \
            --arg ver "$ASU_VER" \
            --arg arch "$ARCH" \
            '{
              ($key): {
                name: $ver,
                version: $ver,
                enabled: true,
                snapshot: false,
                path: "{version}",
                path_packages: "DEPRECATED",
                package_changes: [],
                targets: {"mediatek/filogic": $arch}
              }
            }' > "output/entry-${ASU_KEY}.json"

          # .targets.json maps target → arch (upstream ASU convention)
          # Named by full version so the publish step knows the exact path.
          jq -n --arg arch "$ARCH" '{"mediatek/filogic": $arch}' \
            > "output/targets-${ASU_VER}.json"

          echo "Branch entry:"
          cat "output/entry-${ASU_KEY}.json"

      - name: Upload branch artifacts
        uses: actions/upload-artifact@v5
        with:
          name: branch-entry-${{ matrix.branch_key }}
          path: output/*
          retention-days: 1

  publish:
    needs: resolve
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - name: Download all branch entries
        uses: actions/download-artifact@v5
        with:
          pattern: branch-entry-*
          path: entries/
          merge-multiple: true

      - name: Merge entries into branches.json
        id: merge
        run: |
          set -euo pipefail

          ENTRY_FILES=$(ls entries/entry-*.json 2>/dev/null || true)
          if [[ -z "$ENTRY_FILES" ]]; then
            echo "No entries to publish"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          jq -s 'add | to_entries | sort_by(.key) | from_entries' entries/entry-*.json > branches.json

          echo "Final branches.json:"
          cat branches.json

      - name: Generate .versions.json
        if: steps.merge.outputs.skip != 'true'
        run: |
          # Build version list from the .version field of each branch entry.
          VERSIONS=$(jq -r '[.[].version] | .[]' branches.json | sort -rV)
          LATEST=$(echo "$VERSIONS" | head -1)
          VERSIONS_JSON=$(echo "$VERSIONS" | jq -R . | jq -sc .)

          jq -n \
            --arg upcoming "${LATEST}" \
            --arg stable "${LATEST}" \
            --argjson versions_list "$VERSIONS_JSON" \
            '{
              upcoming_version: $upcoming,
              stable_version: $stable,
              oldstable_version: "",
              versions_list: $versions_list
            }' > .versions.json

          echo "Generated .versions.json:"
          cat .versions.json

      - name: Ensure releases branch exists
        if: steps.merge.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${{ github.repository }}/git/refs/heads/releases" 2>/dev/null || \
            gh api "repos/${{ github.repository }}/git/refs" \
              --method POST \
              --field ref="refs/heads/releases" \
              --field sha="$(git rev-parse HEAD)"

      - name: Push branches.json to releases branch
        if: steps.merge.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          FILE_SHA=$(gh api "repos/${{ github.repository }}/contents/branches.json?ref=releases" \
            --jq '.sha' 2>/dev/null || echo '')

          ENCODED=$(base64 -w0 < branches.json)

          if [[ -n "$FILE_SHA" ]]; then
            gh api "repos/${{ github.repository }}/contents/branches.json" \
              --method PUT \
              --field message="ci: publish branches.json" \
              --field content="$ENCODED" \
              --field sha="$FILE_SHA" \
              --field branch="releases"
          else
            gh api "repos/${{ github.repository }}/contents/branches.json" \
              --method PUT \
              --field message="ci: publish branches.json" \
              --field content="$ENCODED" \
              --field branch="releases"
          fi

          echo "branches.json published"

      - name: Push .versions.json to releases branch
        if: steps.merge.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          FILE_SHA=$(gh api "repos/${{ github.repository }}/contents/.versions.json?ref=releases" \
            --jq '.sha' 2>/dev/null || echo '')

          ENCODED=$(base64 -w0 < .versions.json)

          if [[ -n "$FILE_SHA" ]]; then
            gh api "repos/${{ github.repository }}/contents/.versions.json" \
              --method PUT \
              --field message="ci: publish .versions.json" \
              --field content="$ENCODED" \
              --field sha="$FILE_SHA" \
              --field branch="releases"
          else
            gh api "repos/${{ github.repository }}/contents/.versions.json" \
              --method PUT \
              --field message="ci: publish .versions.json" \
              --field content="$ENCODED" \
              --field branch="releases"
          fi

          echo ".versions.json published"

      - name: Push .targets.json for each release
        if: steps.merge.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for targets_file in entries/targets-*.json; do
            VERSION=$(basename "$targets_file" | sed 's/^targets-//' | sed 's/\.json$//')
            DEST_PATH="${VERSION}/.targets.json"

            echo "Pushing ${DEST_PATH}..."

            FILE_SHA=$(gh api "repos/${{ github.repository }}/contents/${DEST_PATH}?ref=releases" \
              --jq '.sha' 2>/dev/null || echo '')

            ENCODED=$(base64 -w0 < "$targets_file")

            if [[ -n "$FILE_SHA" ]]; then
              gh api "repos/${{ github.repository }}/contents/${DEST_PATH}" \
                --method PUT \
                --field message="ci: publish .targets.json for ${VERSION}" \
                --field content="$ENCODED" \
                --field sha="$FILE_SHA" \
                --field branch="releases"
            else
              gh api "repos/${{ github.repository }}/contents/${DEST_PATH}" \
                --method PUT \
                --field message="ci: publish .targets.json for ${VERSION}" \
                --field content="$ENCODED" \
                --field branch="releases"
            fi

            echo "  Done: ${DEST_PATH}"
          done

          echo "All .targets.json files published"
          echo ""
          echo "=== Deploy complete ==="
          echo "URL: https://raw.githubusercontent.com/${{ github.repository }}/releases/.versions.json"
